<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="500" viewBox="0 0 820 500" role="img" aria-labelledby="title desc">
<title id="title">Cantilever tip displacement convergence</title>
<desc id="desc">CPS4 tip displacement rises from 5.985 mm on a 10 by 4 mesh to 15.147 mm on a 160 by 8 mesh. The dashed Euler-Bernoulli reference is 15.238 mm.</desc>
<defs>
<style>.grid{stroke:#d9e2ec;stroke-width:1}.axis{stroke:#334e68;stroke-width:1.5}.tick{fill:#486581;font:13px system-ui,sans-serif}.label{fill:#102a43;font:700 15px system-ui,sans-serif}.curve{fill:none;stroke:#176b87;stroke-width:3}.ref{fill:none;stroke:#c81d25;stroke-width:2.5;stroke-dasharray:8 7}.point{fill:#176b87;stroke:white;stroke-width:2}.value{fill:#102a43;font:700 12px system-ui,sans-serif}.note{fill:#52606d;font:13px system-ui,sans-serif}</style>
</defs>
<rect width="820" height="500" fill="white"/>
<text x="410" y="32" text-anchor="middle" class="label">Cantilever convergence: 1,000 N tip load</text>
<line x1="105" y1="405.0" x2="770" y2="405.0" class="grid"/>
<text x="93" y="409.0" text-anchor="end" class="tick">0</text>
<line x1="105" y1="309.3" x2="770" y2="309.3" class="grid"/>
<text x="93" y="313.3" text-anchor="end" class="tick">5</text>
<line x1="105" y1="213.6" x2="770" y2="213.6" class="grid"/>
<text x="93" y="217.6" text-anchor="end" class="tick">10</text>
<line x1="105" y1="117.9" x2="770" y2="117.9" class="grid"/>
<text x="93" y="121.9" text-anchor="end" class="tick">15</text>
<line x1="105" y1="113.3" x2="770" y2="113.3" class="ref"/>
<text x="770" y="103.3" text-anchor="end" class="tick" fill="#c81d25">Euler-Bernoulli 15.238 mm</text>
<path d="M 105.0 290.4 L 271.2 195.3 L 437.5 140.2 L 603.8 120.2 L 770.0 115.0" class="curve"/>
<circle cx="105.0" cy="290.4" r="6" class="point"/>
<text x="105.0" y="272.4" text-anchor="middle" class="value">5.985</text>
<circle cx="271.2" cy="195.3" r="6" class="point"/>
<text x="271.2" y="177.3" text-anchor="middle" class="value">10.953</text>
<circle cx="437.5" cy="140.2" r="6" class="point"/>
<text x="437.5" y="122.2" text-anchor="middle" class="value">13.832</text>
<circle cx="603.8" cy="120.2" r="6" class="point"/>
<text x="603.8" y="98.2" text-anchor="middle" class="value">14.877</text>
<circle cx="770.0" cy="115.0" r="6" class="point"/>
<text x="786.0" y="103.0" text-anchor="middle" class="value">15.147</text>
<line x1="105" y1="70" x2="105" y2="405" class="axis"/>
<line x1="105" y1="405" x2="770" y2="405" class="axis"/>
<line x1="105.0" y1="405" x2="105.0" y2="412" class="axis"/>
<text x="105.0" y="432" text-anchor="middle" class="tick">10</text>
<line x1="271.2" y1="405" x2="271.2" y2="412" class="axis"/>
<text x="271.2" y="432" text-anchor="middle" class="tick">20</text>
<line x1="437.5" y1="405" x2="437.5" y2="412" class="axis"/>
<text x="437.5" y="432" text-anchor="middle" class="tick">40</text>
<line x1="603.8" y1="405" x2="603.8" y2="412" class="axis"/>
<text x="603.8" y="432" text-anchor="middle" class="tick">80</text>
<line x1="770.0" y1="405" x2="770.0" y2="412" class="axis"/>
<text x="770.0" y="432" text-anchor="middle" class="tick">160</text>
<text x="437.5" y="466" text-anchor="middle" class="label">Elements along the 2 m span</text>
<text x="35" y="237.5" text-anchor="middle" class="label" transform="rotate(-90 35 237.5)">Maximum displacement (mm)</text>
<line x1="510" y1="466" x2="540" y2="466" class="curve"/><circle cx="525" cy="466" r="5" class="point"/>
<text x="550" y="471" class="note">Solvix CPS4</text>
<line x1="645" y1="466" x2="675" y2="466" class="ref"/>
<text x="685" y="471" class="note">Analytical</text>
<text x="105" y="471" class="note">4 element rows: 10–40; 8 element rows: 80–160</text>
</svg>
